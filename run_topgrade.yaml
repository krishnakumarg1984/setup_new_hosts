---
- name: Run topgrade to update all installed CLI/TUI tools on the target user account's home drive # noqa: no-changed-when
  ansible.builtin.shell: |-
    test -x $HOME/.config/pixi/bin/topgrade &&
    $HOME/.config/pixi/bin/topgrade
  register: topgrade_result
  failed_when: topgrade_result.rc >= 2
  tags: [update_pkgs]
